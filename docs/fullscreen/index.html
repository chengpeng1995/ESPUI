<main><p class="small">Blue 2.2 · 原生 LVGL 模拟器截图</p><h1>应用全屏黑底，弹窗保留玻璃质感</h1><p>应用直接占满 466 × 466 圆屏，没有居中外框或关闭按钮。蓝色操作与彩色图标保留，通过边缘手势返回、回首页和切换应用。截图使用模拟数据。</p><div class="grid"><figure><img src="timer.png" alt="全屏黑底计时器"><figcaption>计时器 · 全屏黑底</figcaption></figure><figure><img src="settings.png" alt="全屏黑底设置列表"><figcaption>设置 · 内容直接滚动</figcaption></figure><figure><img src="clock.png" alt="全屏黑底时钟"><figcaption>时钟 · 实色操作</figcaption></figure><figure><img src="assistant.png" alt="全屏黑底助理演示"><figcaption>助理 · 演示标识保留</figcaption></figure></div><h2>临时覆盖层</h2><p>确认与提醒保留柔化玻璃表面，遮罩阻断底层点击。设备使用离线材质近似模糊效果，不进行实时背景模糊。</p><div class="grid"><figure><img src="confirm.png" alt="黑底页面上的未保存确认玻璃弹窗"><figcaption>未保存确认 · 玻璃浮层</figcaption></figure><figure><img src="alert.png" alt="到点提醒玻璃覆盖层"><figcaption>到点提醒 · 停止后恢复原页</figcaption></figure></div><p class="small">尚未烧录设备；模拟器截图不代表真实 AMOLED 色彩、触控和帧率已验收。</p><p><a href="../../VERIFICATION.md">构建与验收记录</a> · <a href="../../圆屏助理-UI设计规范.html">交互规范</a></p></main></html>
